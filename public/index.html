<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi Stream Studio</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ===== Top Header ===== -->
<header class="top-header">
  <button id="menu-btn" class="icon-btn" title="Menu">☰</button>
  <div class="header-title">Multi Stream Studio</div>
  <div class="user-menu-wrap">
    <button id="user-menu-btn" class="user-chip">
      <span class="avatar">👤</span><span id="header-username">admin</span>
    </button>
    <div id="user-menu" class="dropdown hidden">
      <button id="user-menu-username" class="dropdown-item">Authorization Settings</button>
      <button id="logout-btn" class="dropdown-item danger">Logout</button>
    </div>
  </div>
</header>

<!-- ===== Slide-out Menu ===== -->
<div id="menu-overlay" class="overlay hidden"></div>
<nav id="side-menu" class="side-menu hidden">
  <div class="side-menu-title">Navigation</div>
  <button class="menu-item" data-view="editor">Editor</button>
  <div class="menu-group-label">Settings</div>
  <button class="menu-item sub" data-view="settings-authorization">Authorization</button>
  <button class="menu-item sub" data-view="settings-stream">Stream</button>
  <button class="menu-item sub" data-view="settings-output">Output</button>
  <button class="menu-item sub" data-view="settings-audio">Audio</button>
  <button class="menu-item sub" data-view="settings-video">Video</button>
  <button class="menu-item sub" data-view="settings-advanced">Advanced</button>
</nav>

<!-- ===== Editor View ===== -->
<main id="view-editor" class="view">

  <section class="workspace-row">
    <div class="workspace-wrap">
      <div id="workspace" class="workspace"></div>
      <button id="preview-toggle" class="preview-toggle" title="Toggle preview">✅ Preview</button>
    </div>
  </section>

  <section class="panels-row three-col">
    <div class="panel">
      <div class="panel-header">Scenes
        <div class="panel-actions">
          <button class="icon-btn small" id="scene-add-btn" title="Add Scene">+</button>
          <button class="icon-btn small" id="scene-remove-btn" title="Remove Scene">−</button>
        </div>
      </div>
      <div id="scene-list" class="list"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Sources
        <div class="panel-actions">
          <div class="dropdown-wrap">
            <button class="icon-btn small" id="source-add-btn" title="Add Source">+</button>
            <div id="source-add-menu" class="dropdown hidden">
              <button class="dropdown-item" data-source-type="image">Image</button>
              <button class="dropdown-item" data-source-type="media">Media</button>
              <button class="dropdown-item" data-source-type="text">Text</button>
            </div>
          </div>
          <button class="icon-btn small" id="source-remove-btn" title="Remove Source">−</button>
        </div>
      </div>
      <div id="source-list" class="list"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Audio Mixer</div>
      <div id="audio-mixer-list" class="list"></div>
    </div>
  </section>

  <section class="panels-row two-col">
    <div class="panel">
      <div class="panel-header">Platforms
        <div class="panel-actions">
          <button class="icon-btn small" id="platform-add-btn" title="Add Platform">+</button>
          <button class="icon-btn small" id="platform-remove-btn" title="Remove Platform">−</button>
        </div>
      </div>
      <div id="platform-list" class="list"></div>
    </div>

    <div class="panel">
      <div class="panel-header">Controls</div>
      <div class="controls-body">
        <button id="start-streaming-btn" class="btn btn-success btn-block">▶ Start Streaming</button>
        <button id="end-streaming-btn" class="btn btn-danger btn-block hidden">■ End Streaming</button>
        <p id="stream-error" class="error-text"></p>
      </div>
    </div>
  </section>

  <footer class="status-bar">
    <div>Uptime: <span id="status-uptime">00:00:00</span></div>
    <div>Status: <span id="status-text" class="status-pill idle">Idle</span></div>
  </footer>
</main>

<!-- ===== Settings Views ===== -->
<main id="view-settings" class="view hidden">
  <div class="settings-shell">
    <h2 id="settings-title">Settings</h2>
    <div id="settings-body"></div>
    <div class="settings-actions">
      <button id="settings-apply-btn" class="btn btn-primary">Apply</button>
      <button id="settings-cancel-btn" class="btn btn-secondary">Cancel</button>
    </div>
  </div>
</main>

<!-- ===== Modals ===== -->
<div id="modal-overlay" class="overlay hidden"></div>
<div id="modal-root" class="hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/settings.js"></script>
</body>
</html>
