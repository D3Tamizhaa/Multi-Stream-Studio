<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi Stream Studio</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ===================== LOGIN VIEW ===================== -->
<section id="view-login" class="view">
  <form id="login-form" class="login-card">
    <h1>Multi Stream Studio</h1>
    <label>Username<input id="login-username" type="text" autocomplete="username" required></label>
    <label>Password<input id="login-password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error-text"></p>
    <button type="submit" class="btn primary">Login</button>
  </form>
</section>

<!-- ===================== APP VIEW ===================== -->
<section id="view-app" class="view hidden">

  <header class="top-header">
    <button id="menu-btn" class="icon-btn" title="Menu">&#9776;</button>
    <h1 class="app-title">Multi Stream Studio</h1>
    <div class="user-menu">
      <button id="user-menu-btn" class="user-chip"><span id="username-label">admin</span> &#9662;</button>
      <div id="user-menu-dropdown" class="dropdown hidden">
        <a href="#" id="user-menu-auth">Authorization Settings</a>
        <a href="#" id="user-menu-logout">Logout</a>
      </div>
    </div>
  </header>

  <nav id="side-menu" class="side-menu hidden">
    <a href="#" data-route="editor">Editor</a>
    <div class="menu-group">Settings
      <a href="#" data-route="settings/authorization">Authorization</a>
      <a href="#" data-route="settings/stream">Stream</a>
      <a href="#" data-route="settings/output">Output</a>
      <a href="#" data-route="settings/audio">Audio</a>
      <a href="#" data-route="settings/video">Video</a>
      <a href="#" data-route="settings/advanced">Advanced</a>
    </div>
  </nav>

  <!-- ---------- EDITOR ROUTE ---------- -->
  <main id="route-editor" class="route">
    <div class="workspace-row">
      <div class="workspace-wrap">
        <div id="workspace" class="workspace"></div>
      </div>
      <button id="preview-toggle" class="icon-btn preview-toggle" title="Toggle workspace preview">&#128065;</button>
    </div>

    <div class="panels-row">
      <div class="panel" id="panel-scenes">
        <div class="panel-header">Scenes</div>
        <ul id="scene-list" class="list"></ul>
        <div class="panel-toolbar">
          <button data-action="add-scene" class="icon-btn" title="Add Scene">+</button>
          <button data-action="remove-scene" class="icon-btn" title="Remove Scene">&minus;</button>
        </div>
      </div>

      <div class="panel" id="panel-sources">
        <div class="panel-header">Sources</div>
        <ul id="source-list" class="list"></ul>
        <div class="panel-toolbar">
          <button data-action="add-source" class="icon-btn" title="Add Source">+</button>
          <button data-action="remove-source" class="icon-btn" title="Remove Source">&minus;</button>
        </div>
      </div>

      <div class="panel" id="panel-audio">
        <div class="panel-header">Audio Mixer</div>
        <ul id="audio-mixer-list" class="list"></ul>
      </div>
    </div>

    <div class="panels-row">
      <div class="panel" id="panel-platforms">
        <div class="panel-header">Platforms</div>
        <ul id="platform-list" class="list"></ul>
        <div class="panel-toolbar">
          <button data-action="add-platform" class="icon-btn" title="Add Platform">+</button>
          <button data-action="remove-platform" class="icon-btn" title="Remove Platform">&minus;</button>
        </div>
      </div>

      <div class="panel" id="panel-controls">
        <div class="panel-header">Controls</div>
        <div class="controls-row">
          <button id="btn-start-stream" class="btn primary">Start Streaming</button>
          <button id="btn-stop-stream" class="btn danger" disabled>End Streaming</button>
        </div>
      </div>
    </div>

    <footer class="status-bar">
      <span>Uptime: <strong id="status-uptime">00:00:00</strong></span>
      <span>Status: <strong id="status-text">Idle</strong></span>
    </footer>
  </main>

  <!-- ---------- SETTINGS ROUTES ---------- -->
  <main id="route-settings" class="route hidden">
    <div id="settings-body" class="settings-body"></div>
  </main>

</section>

<!-- ===================== MODALS (source editors, scene add, platform add) ===================== -->
<div id="modal-root"></div>

<script src="/js/api.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/settings.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
