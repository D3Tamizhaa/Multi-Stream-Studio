<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Stream Studio — Login</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10" stroke="var(--accent)" stroke-width="2"/>
        <path d="M9 8l7 4-7 4V8z" fill="var(--accent)"/>
      </svg>
    </div>
    <h1>Multi Stream Studio</h1>
    <p class="login-sub">Sign in to continue</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <div id="login-error" class="form-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p class="login-hint">Default credentials: <code>admin</code> / <code>admin</code></p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
