<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi Stream Studio</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="screen">
  <form id="login-form" class="login-card">
    <h1>Multi Stream Studio</h1>
    <label>Username <input type="text" id="login-username" autocomplete="username" required /></label>
    <label>Password <input type="password" id="login-password" autocomplete="current-password" required /></label>
    <p id="login-error" class="error-text"></p>
    <button type="submit">Login</button>
  </form>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app-screen" class="screen hidden">

  <!-- Top Header -->
  <header class="top-header">
    <button id="menu-btn" class="icon-btn" title="Menu">&#9776;</button>
    <div class="header-title">Multi Stream Studio</div>
    <div class="user-menu">
      <button id="user-menu-btn" class="user-btn"><span id="username-label"></span> &#9662;</button>
      <div id="user-dropdown" class="dropdown hidden">
        <button id="user-settings-link">Authorization Settings</button>
        <button id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <!-- Side Nav -->
  <nav id="side-nav" class="side-nav hidden">
    <button class="nav-item" data-view="editor">Editor</button>
    <div class="nav-group-label">Settings</div>
    <button class="nav-item" data-view="settings-authorization">Authorization</button>
    <button class="nav-item" data-view="settings-stream">Stream</button>
    <button class="nav-item" data-view="settings-output">Output</button>
    <button class="nav-item" data-view="settings-audio">Audio</button>
    <button class="nav-item" data-view="settings-video">Video</button>
    <button class="nav-item" data-view="settings-advanced">Advanced</button>
  </nav>

  <!-- ============ EDITOR VIEW ============ -->
  <main id="view-editor" class="view">

    <section class="workspace-row">
      <div class="workspace-wrap">
        <div id="workspace" class="workspace"></div>
        <button id="preview-toggle" class="preview-toggle" title="Toggle Workspace Preview">&#10003;</button>
      </div>
    </section>

    <section class="panels-row">
      <div class="panel" id="panel-scenes">
        <div class="panel-header">
          <span>Scenes</span>
          <span class="panel-actions">
            <button id="scene-add" class="icon-btn" title="Add Scene">+</button>
            <button id="scene-remove" class="icon-btn" title="Remove Scene">&minus;</button>
          </span>
        </div>
        <ul id="scene-list" class="list"></ul>
      </div>

      <div class="panel" id="panel-sources">
        <div class="panel-header">
          <span>Sources</span>
          <span class="panel-actions">
            <button id="source-add" class="icon-btn" title="Add Source">+</button>
            <button id="source-remove" class="icon-btn" title="Remove Source">&minus;</button>
          </span>
        </div>
        <ul id="source-list" class="list"></ul>
      </div>

      <div class="panel" id="panel-audio">
        <div class="panel-header"><span>Audio Mixer</span></div>
        <ul id="audio-mixer-list" class="list"></ul>
      </div>
    </section>

    <section class="stream-row">
      <div class="panel" id="panel-platforms">
        <div class="panel-header">
          <span>Platforms</span>
          <span class="panel-actions">
            <button id="platform-add" class="icon-btn" title="Add Platform">+</button>
            <button id="platform-remove" class="icon-btn" title="Remove Platform">&minus;</button>
          </span>
        </div>
        <ul id="platform-list" class="list"></ul>
      </div>

      <div class="panel" id="panel-controls">
        <div class="panel-header"><span>Controls</span></div>
        <div class="controls-body">
          <button id="start-streaming-btn" class="primary-btn">Start Streaming</button>
          <button id="end-streaming-btn" class="danger-btn hidden">End Streaming</button>
        </div>
      </div>
    </section>

    <!-- Bottom Status Bar -->
    <footer class="status-bar">
      <div class="status-item"><span class="status-label">Uptime</span><span id="stat-uptime">00:00:00</span></div>
      <div class="status-item"><span class="status-label">Bitrate</span><span id="stat-bitrate">0 kbit/s</span></div>
      <div class="status-item"><span class="status-label">FPS</span><span id="stat-fps">0</span></div>
      <div class="status-item"><span class="status-label">CPU</span><span id="stat-cpu">0%</span></div>
      <div class="status-item"><span class="status-label">RAM</span><span id="stat-ram">0%</span></div>
      <div class="status-item"><span class="status-label">Status</span><span id="stat-status" class="status-pill offline">Offline</span></div>
    </footer>
  </main>

  <!-- ============ SETTINGS VIEWS ============ -->
  <main id="view-settings" class="view hidden">
    <div class="settings-card">
      <h2 id="settings-title">Settings</h2>
      <div id="settings-body"></div>
      <div class="settings-actions">
        <button id="settings-apply" class="primary-btn">Apply</button>
        <button id="settings-cancel" class="secondary-btn">Cancel</button>
      </div>
    </div>
  </main>

</div>

<!-- ============ MODALS ============ -->
<div id="modal-root"></div>

<script src="/js/api.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/workspace.js"></script>
<script src="/js/streaming.js"></script>
<script src="/js/settingsForms.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
