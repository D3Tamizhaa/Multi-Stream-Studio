<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Stream Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">MS</div>
      <h1>Multi Stream Studio</h1>
      <p>Sign in to your streaming workspace</p>

      <label>Username</label>
      <input id="loginUser" required autocomplete="username">

      <label>Password</label>
      <input id="loginPassword" type="password" required autocomplete="current-password">

      <button class="primary wide" type="submit">Login / Sign in</button>
    </form>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <strong>Multi Stream Studio</strong>
      <button id="userBtn" class="user-btn">User ▾</button>
    </header>

    <main class="workspace">
      <aside id="sidebar" class="sidebar">
        <button class="nav-item active" data-page="editor">▸ Editor</button>

        <div class="nav-section">
          <button class="nav-item" id="settingsToggle">⚙ Settings</button>
          <div id="settingsNav" class="subnav">
            <button data-page="authorization">Authorization</button>
            <button data-page="stream">Stream</button>
            <button data-page="output">Output</button>
            <button data-page="audio">Audio</button>
            <button data-page="video">Video</button>
            <button data-page="advanced">Advanced</button>
          </div>
        </div>
      </aside>

      <section class="content">
        <div id="editorPage" class="page">
          <section class="preview-panel panel">
            <div class="panel-title">
              <span>PREVIEW</span>
              <span id="previewSize">1920 × 1080</span>
            </div>

            <div class="preview-wrap">
              <div id="canvasPreview" class="canvas-preview">
                <div class="preview-empty">
                  <span>CANVAS PREVIEW</span>
                  <small>1920 × 1080</small>
                </div>
              </div>
            </div>

            <label class="preview-toggle">
              <input id="previewEnabled" type="checkbox" checked>
              Preview Enabled
            </label>
          </section>

          <section class="editor-grid">
            <div class="panel scenes-panel">
              <div class="panel-title">
                <span>Scenes</span>
                <span>
                  <button class="small-btn" id="addScene">+</button>
                  <button class="small-btn danger" id="removeScene">−</button>
                </span>
              </div>

              <div id="sceneList" class="list"></div>

              <div class="panel-actions">
                <button id="sceneUp">↑ Move Up</button>
                <button id="sceneDown">↓ Move Down</button>
              </div>
            </div>

            <div class="panel sources-panel">
              <div class="panel-title">
                <span>Sources</span>
                <span>
                  <button class="small-btn" id="addSource">+</button>
                  <button class="small-btn danger" id="removeSource">−</button>
                </span>
              </div>

              <div id="sourceList" class="list"></div>

              <div class="panel-actions">
                <button id="sourceUp">↑ Move Up</button>
                <button id="sourceDown">↓ Move Down</button>
                <button id="sourceProperties">⚙ Properties</button>
              </div>
            </div>

            <div class="panel mixer-panel">
              <div class="panel-title">Audio Mixer</div>

              <div class="mixer-source">
                <strong>Media File</strong>
                <span id="mixerVolume">80%</span>
              </div>

              <input id="volume" class="volume" type="range" min="0" max="100" value="80">

              <div class="mixer-actions">
                <button id="muteBtn">🔇 Mute</button>
                <button id="mixerProperties">⚙ Properties</button>
              </div>
            </div>
          </section>

          <section class="bottom-grid">
            <div class="panel platforms-panel">
              <div class="panel-title">
                <span>Platforms</span>
                <span>
                  <button class="small-btn" id="addPlatform">+</button>
                  <button class="small-btn danger" id="removePlatform">−</button>
                </span>
              </div>

              <div id="platformList" class="platform-list"></div>
            </div>

            <div class="panel controls-panel">
              <div class="panel-title">Controls</div>

              <button id="startStream" class="stream-start">▶ Start Streaming</button>
              <button id="endStream" class="stream-stop" disabled>■ End Streaming</button>
            </div>
          </section>
        </div>

        <div id="settingsPage" class="page hidden">
          <div class="settings-layout">
            <div id="settingsMenu" class="settings-menu">
              <h2>Settings</h2>
              <button data-setting="authorization">Authorization</button>
              <button data-setting="stream">Stream</button>
              <button data-setting="output">Output</button>
              <button data-setting="audio">Audio</button>
              <button data-setting="video">Video</button>
              <button data-setting="advanced">Advanced</button>
            </div>

            <div id="settingsContent" class="settings-content"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="usage">
      <div><span>Uptime</span><strong id="uptime">00:00:00</strong></div>
      <div><span>Bitrate</span><strong>6000 kbit/s</strong></div>
      <div><span>FPS</span><strong id="fps">60</strong></div>
      <div><span>CPU</span><strong id="cpu">12%</strong></div>
      <div><span>RAM</span><strong id="ram">38%</strong></div>
      <div><span>Status</span><strong id="status" class="offline">● Offline</strong></div>
    </footer>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Add Source</h2>
        <button id="modalClose" class="icon-btn">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
